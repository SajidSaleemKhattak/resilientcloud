# Append to compose.yaml, compose.two.yaml, compose.recovery.yaml and compose.dashboard.yaml.
# Compose >=2.24.4 is required for !override. No local file is replaced.
x-logs: &logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend-a:
    build: !reset null
    image: resilientcloud-backend:aws
    pull_policy: never
    environment:
      FAULT_INJECTION_ENABLED: ${RC_ENABLE_FAULTS:-false}
    logging: *logs
  backend-b:
    build: !reset null
    image: resilientcloud-backend:aws
    pull_policy: never
    environment:
      FAULT_INJECTION_ENABLED: ${RC_ENABLE_FAULTS:-false}
    logging: *logs
  gate:
    build: !reset null
    image: resilientcloud-recovery:aws
    pull_policy: never
    logging: *logs
  controller:
    build: !reset null
    image: resilientcloud-recovery:aws
    pull_policy: never
    environment:
      RECOVERY_ENABLED: "true"
    logging: *logs
  status:
    build: !reset null
    image: resilientcloud-recovery:aws
    pull_policy: never
    logging: *logs
  gateway:
    pull_policy: never
    ports: !override ["127.0.0.1:8080:8080"]
    networks: !override [app, status-read, web]
    logging: *logs
  https:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    pull_policy: never
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/tmp:size=16m]
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?set an existing DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?set certificate contact email}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
    ports: ["80:80", "443:443"]
    networks: [web, edge]
    depends_on: [gateway]
    logging: *logs

networks:
  web:
    internal: true
volumes:
  tls-data:
