worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;
    include /etc/nginx/upstream.conf;
    upstream status_reader {
        zone status_reader 64k;
        server status:4000 resolve;
    }
    log_format measured escape=json '{"time":"$time_iso8601","request":"$request",'
        '"status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        access_log /dev/stdout measured;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        location = /api {
            limit_except GET { deny all; }
            proxy_pass http://backends;
            proxy_connect_timeout 500ms;
            proxy_read_timeout 1s;
            proxy_send_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 2s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /status {
            limit_except GET { deny all; }
            proxy_pass http://status_reader;
            proxy_connect_timeout 500ms;
            proxy_read_timeout 1s;
        }
        location = /events {
            limit_except GET { deny all; }
            proxy_pass http://status_reader;
            proxy_connect_timeout 500ms;
            proxy_read_timeout 1s;
        }
        location = / {
            limit_except GET { deny all; }
            expires -1;
            try_files /index.html =404;
        }
        location /assets/ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location = /favicon.svg {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location = /experiments/summary.json {
            limit_except GET { deny all; }
            expires -1;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
