name: resilientcloud

x-backend: &backend
  image: resilientcloud-backend:m1
  build: .
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 128m
  cpus: 0.5
  networks: [app]
  labels:
    io.resilientcloud.role: backend
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 1s
    retries: 2
    start_period: 2s

services:
  backend-a:
    <<: *backend
    environment:
      INSTANCE_ID: backend-a
      PORT: "3000"
      FAULT_INJECTION_ENABLED: "true"

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: "no"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/one.conf:/etc/nginx/upstream.conf:ro
    depends_on:
      backend-a:
        condition: service_healthy
    networks: [app, edge]

networks:
  app:
    internal: true
  edge: {}
